name: Composite scan (nightly)

# GitHub schedules run in UTC and ignore daylight saving, so the job is queued
# at 22:07 and 23:07 UTC plus a late retry, and the first step lets it through
# only once it is 6 pm or later in New York. The scan itself is a no-op when
# that session is already published, so extra runs cost a few seconds.
on:
  schedule:
    - cron: "7 22 * * 1-5"   # 6:07 pm ET during daylight time
    - cron: "7 23 * * 1-5"   # 6:07 pm ET during standard time (retry in summer)
    - cron: "7 1 * * 2-6"    # late retry, 8-9 pm ET
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if today's session is already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: composite-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Only run at or after 6 pm New York time
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" -ge 18 ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "It is ${hour}:xx in New York - waiting for the 6 pm run."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.go == 'yes'
        run: pip install -r scripts/requirements.txt

      - name: Run scan
        if: steps.gate.outputs.go == 'yes'
        run: python scripts/composite_scan.py ${{ inputs.force && '--force' || '' }}

      - name: Publish results
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "composite-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/composite
          if git diff --cached --quiet; then
            echo "No new data to publish."
          else
            git commit -m "Composite scan $(TZ=America/New_York date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
